name: Main
on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 'lts/*'
    - name: Build
      run: |
        corepack enable
        yarn install --immutable
        yarn build
    - name: Check built manifests
      run: python3 scripts/check-built-manifests.py .
