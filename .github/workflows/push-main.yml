name: Main
on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    if: "! startsWith(github.event.head_commit.message, '[CI Skip]')"
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: actions/setup-node@v4
      with:
        node-version: 'lts/*'
    - name: Build
      run: |
        corepack enable
        yarn install --immutable
        yarn build
